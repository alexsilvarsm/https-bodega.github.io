<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomador de Pedidos Nestlé</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --nestle-blue: #003DA5;
    --nestle-yellow: #FFE600;
    --ink: #1a1a2e;
    --paper: #fafaf7;
    --line: #dcdcd4;
    --accent: #E4002B;
    --green: #1b8a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-bottom: 110px;
  }
  header {
    background: var(--nestle-blue);
    color: white;
    padding: 18px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .sub {
    margin-top: 3px;
    font-size: 0.78rem;
    color: #cfe0ff;
  }
  .stripe {
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--nestle-yellow) 0 24px, var(--nestle-blue) 24px 48px);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 12px 20px;
  }
  .cliente-box {
    max-width: 720px;
    margin: 12px auto 0;
    padding: 0 12px;
  }
  .cliente-box label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--nestle-blue);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
  }
  .cliente-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 0.95rem;
    background: white;
  }
  .cliente-box input:focus {
    outline: none;
    border-color: var(--nestle-blue);
  }
  .group {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .group-head {
    display: flex;
    gap: 10px;
    align-items: stretch;
    padding: 10px;
    border-bottom: 1px dashed var(--line);
    background: #fffdf2;
  }
  .group-head img {
    width: 108px;
    min-width: 108px;
    height: auto;
    border-radius: 6px;
    border: 1px solid var(--line);
    object-fit: cover;
  }
  .group-title {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--nestle-blue);
    align-self: center;
  }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid #f0f0e8;
  }
  .item-row:last-child { border-bottom: none; }
  .item-info { flex: 1; min-width: 0; }
  .item-code {
    font-size: 0.7rem;
    color: #888;
    font-family: 'Courier New', monospace;
  }
  .item-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
  }
  .item-meta {
    font-size: 0.72rem;
    color: var(--nestle-blue);
    margin-top: 1px;
    font-weight: 600;
  }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--nestle-blue);
    background: white;
    color: var(--nestle-blue);
    font-size: 1.1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .qty-btn:active { background: #e8f0ff; }
  .qty-input {
    width: 40px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 2px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink);
  }
  .item-row.has-qty {
    background: #fff9d6;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 2px solid var(--nestle-blue);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 30;
    box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
  }
  .footer-total {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--nestle-blue);
    line-height: 1.3;
  }
  .footer-total .cajas {
    font-size: 1.15rem;
    color: var(--accent);
  }
  .footer-total .monto {
    font-size: 0.85rem;
    color: var(--ink);
  }
  .btn-generar {
    background: var(--nestle-blue);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-generar:active { background: #002d7a; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 40;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: white;
    width: 100%;
    max-width: 720px;
    max-height: 85vh;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px 16px;
    overflow-y: auto;
  }
  .sheet h2 {
    margin: 0 0 4px;
    color: var(--nestle-blue);
    font-size: 1.1rem;
  }
  .sheet .fecha {
    font-size: 0.78rem;
    color: #888;
    margin-bottom: 12px;
  }
  table.resumen {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }
  table.resumen th {
    text-align: left;
    border-bottom: 2px solid var(--nestle-blue);
    padding: 6px 4px;
    color: var(--nestle-blue);
  }
  table.resumen td {
    padding: 6px 4px;
    border-bottom: 1px solid #eee;
  }
  table.resumen td.num { text-align: center; font-weight: 700; }
  table.resumen td.money { text-align: right; }
  .resumen-total-row td {
    font-weight: 700;
    background: #fff9d6;
  }
  .sheet-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .sheet-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-pdf { background: var(--nestle-blue); color: white; }
  .btn-img { background: #6a4fb3; color: white; }
  .btn-compartir { background: var(--green); color: white; }
  .btn-nuevo { background: var(--accent); color: white; }
  .btn-cerrar { background: #eee; color: #333; }
  .sheet-actions.row2 { margin-top: 8px; }
  .pdf-status {
    text-align: center;
    font-size: 0.78rem;
    color: #888;
    margin-top: 6px;
    min-height: 16px;
  }
  .preview-area {
    display: none;
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #f4f4f0;
  }
  .preview-area.open { display: block; }
  .preview-area img {
    width: 100%;
    display: block;
  }
  .preview-area iframe {
    width: 100%;
    height: 420px;
    border: none;
    display: block;
  }
  .preview-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--nestle-blue);
    padding: 8px 10px 0;
  }
  .empty-msg {
    text-align: center;
    color: #999;
    padding: 30px 10px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>🍦 Tomador de Pedidos</h1>
  <div class="sub">Toca la cantidad de cajas por código</div>
</header>
<div class="stripe"></div>

<div class="cliente-box">
  <label for="clienteInput">Cliente</label>
  <input type="text" id="clienteInput" placeholder="Nombre del cliente" autocomplete="off">
</div>

<main id="main"></main>

<footer>
  <div class="footer-total">
    <div>Total cajas: <span class="cajas" id="totalCajas">0</span></div>
    <div class="monto">Total: S/ <span id="totalMonto">0.00</span></div>
  </div>
  <button class="btn-generar" onclick="generarResumen()">Generar pedido</button>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>Resumen del pedido</h2>
    <div class="fecha" id="fecha"></div>
    <div id="resumenBody"></div>
    <div class="sheet-actions">
      <button class="btn-pdf" onclick="emitirPDF()">📄 Emitir PDF</button>
      <button class="btn-img" onclick="emitirImagen()">🖼️ Emitir imagen</button>
    </div>
    <div class="sheet-actions row2">
      <button class="btn-compartir" onclick="compartir()">📤 Compartir</button>
      <button class="btn-cerrar" onclick="cerrarResumen()">Cerrar</button>
    </div>
    <div class="sheet-actions row2">
      <button class="btn-nuevo" onclick="nuevoPedido()">🆕 Nuevo pedido</button>
    </div>
    <div class="pdf-status" id="pdfStatus"></div>
    <div class="preview-area" id="previewArea">
      <div class="preview-label" id="previewLabel"></div>
      <div id="previewContent"></div>
    </div>
  </div>
</div>

const qtyState = {};

function fmt(n) {
  return n.toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  GROUPS.forEach(group => {
    const g = document.createElement('div');
    g.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';
    const img = document.createElement('img');
    img.src = IMAGES[group.cell];
    img.alt = group.title;
    const titleDiv = document.createElement('div');
    titleDiv.className = 'group-title';
    titleDiv.textContent = group.title;
    head.appendChild(img);
    head.appendChild(titleDiv);
    g.appendChild(head);

    group.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.id = 'row-' + item.code;

      const info = document.createElement('div');
      info.className = 'item-info';
      info.innerHTML = '<div class="item-code">' + item.code + '</div>' +
        '<div class="item-name">' + item.name + '</div>' +
        '<div class="item-meta">' + item.unx + ' un/caja · S/ ' + fmt(item.precio) + ' /caja</div>';

      const ctrl = document.createElement('div');
      ctrl.className = 'qty-control';

      const minus = document.createElement('div');
      minus.className = 'qty-btn';
      minus.textContent = '−';
      minus.onclick = () => changeQty(item.code, -1);

      const input = document.createElement('input');
      input.className = 'qty-input';
      input.type = 'number';
      input.min = '0';
      input.id = 'qty-' + item.code;
      input.value = qtyState[item.code] || 0;
      input.onchange = (e) => setQty(item.code, parseInt(e.target.value) || 0);

      const plus = document.createElement('div');
      plus.className = 'qty-btn';
      plus.textContent = '+';
      plus.onclick = () => changeQty(item.code, 1);

      ctrl.appendChild(minus);
      ctrl.appendChild(input);
      ctrl.appendChild(plus);

      row.appendChild(info);
      row.appendChild(ctrl);
      g.appendChild(row);
    });

    main.appendChild(g);
  });
}

function changeQty(code, delta) {
  const current = qtyState[code] || 0;
  setQty(code, Math.max(0, current + delta));
}

function setQty(code, value) {
  qtyState[code] = value;
  const input = document.getElementById('qty-' + code);
  if (input) input.value = value;
  const row = document.getElementById('row-' + code);
  if (row) row.classList.toggle('has-qty', value > 0);
  updateTotal();
}

function updateTotal() {
  let cajas = 0;
  let monto = 0;
  Object.entries(qtyState).forEach(([code, qty]) => {
    if (qty > 0) {
      const item = findItem(code);
      cajas += qty;
      if (item) monto += qty * item.precio;
    }
  });
  document.getElementById('totalCajas').textContent = cajas;
  document.getElementById('totalMonto').textContent = fmt(monto);
}

function findItem(code) {
  for (const g of GROUPS) {
    for (const it of g.items) {
      if (it.code === code) return it;
    }
  }
  return null;
}

function generarResumen() {
  const body = document.getElementById('resumenBody');
  const entries = Object.entries(qtyState).filter(([c,q]) => q > 0);
  if (entries.length === 0) {
    body.innerHTML = '<div class="empty-msg">Aún no has agregado cantidades.<br>Toca + en los productos que deseas pedir.</div>';
  } else {
    let totalCajas = 0;
    let totalMonto = 0;
    let rows = '';
    entries.forEach(([code, qty]) => {
      const item = findItem(code);
      const subtotal = item ? qty * item.precio : 0;
      totalCajas += qty;
      totalMonto += subtotal;
      rows += '<tr><td>' + code + '</td><td>' + (item ? item.name : '') + '</td><td class="num">' + qty + '</td><td class="money">' + fmt(subtotal) + '</td></tr>';
    });
    body.innerHTML = '<table class="resumen"><thead><tr><th>Código</th><th>Nombre</th><th>Cajas</th><th>S/</th></tr></thead><tbody>' +
      rows +
      '<tr class="resumen-total-row"><td colspan="2">TOTAL</td><td class="num">' + totalCajas + '</td><td class="money">' + fmt(totalMonto) + '</td></tr>' +
      '</tbody></table>';
  }
  const cliente = document.getElementById('clienteInput').value.trim();
  const clienteLine = cliente ? ('Cliente: ' + cliente) : '';
  document.getElementById('fecha').textContent = [clienteLine, new Date().toLocaleString('es-PE', {dateStyle:'full', timeStyle:'short'})].filter(Boolean).join(' · ');
  document.getElementById('overlay').classList.add('open');
}

function cerrarResumen() {
  document.getElementById('overlay').classList.remove('open');
}

function nuevoPedido() {
  if (!confirm('¿Vaciar el pedido actual y empezar uno nuevo?')) return;

  Object.keys(qtyState).forEach(code => setQty(code, 0));
  document.getElementById('clienteInput').value = '';
  lastFile = null;

  if (lastPreviewUrl) {
    URL.revokeObjectURL(lastPreviewUrl);
    lastPreviewUrl = null;
  }
  document.getElementById('previewArea').classList.remove('open');
  document.getElementById('previewContent').innerHTML = '';
  document.getElementById('pdfStatus').textContent = 'Pedido vaciado. Listo para uno nuevo.';

  cerrarResumen();
}

let lastFile = null;
let lastPreviewUrl = null;

function showPreview(file, type) {
  const area = document.getElementById('previewArea');
  const label = document.getElementById('previewLabel');
  const content = document.getElementById('previewContent');

  if (lastPreviewUrl) {
    URL.revokeObjectURL(lastPreviewUrl);
    lastPreviewUrl = null;
  }

  const url = URL.createObjectURL(file);
  lastPreviewUrl = url;

  if (type === 'image') {
    label.textContent = 'Vista previa de la imagen';
    content.innerHTML = '<img src="' + url + '" alt="Vista previa">';
  } else {
    label.textContent = 'Vista previa del PDF';
    content.innerHTML = '<iframe src="' + url + '"></iframe>';
  }
  area.classList.add('open');
}

function buildOrderData() {
  const entries = Object.entries(qtyState).filter(([c,q]) => q > 0);
  const cliente = document.getElementById('clienteInput').value.trim();
  let totalCajas = 0;
  let totalMonto = 0;
  const rows = entries.map(([code, qty]) => {
    const item = findItem(code);
    const subtotal = item ? qty * item.precio : 0;
    totalCajas += qty;
    totalMonto += subtotal;
    return { code, name: item ? item.name : '', qty, subtotal };
  });
  return { entries, cliente, rows, totalCajas, totalMonto };
}

async function emitirPDF() {
  const statusEl = document.getElementById('pdfStatus');
  const { entries, cliente, rows, totalCajas, totalMonto } = buildOrderData();
  if (entries.length === 0) {
    statusEl.textContent = 'Agrega cantidades antes de emitir el PDF.';
    return;
  }
  if (!window.jspdf) {
    statusEl.textContent = 'No se pudo cargar el generador de PDF. Revisa tu conexión.';
    return;
  }
  statusEl.textContent = 'Generando PDF...';

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const fechaStr = new Date().toLocaleString('es-PE', { dateStyle: 'full', timeStyle: 'short' });
  const marginX = 40;
  let y = 50;

  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('Resumen de Pedido', marginX, y);
  y += 22;

  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  doc.text('Fecha: ' + fechaStr, marginX, y);
  y += 16;
  if (cliente) {
    doc.text('Cliente: ' + cliente, marginX, y);
    y += 16;
  }
  y += 6;

  doc.setDrawColor(0, 61, 165);
  doc.setLineWidth(1);
  doc.line(marginX, y, 555, y);
  y += 18;

  const colCode = marginX;
  const colName = marginX + 70;
  const colQty = 400;
  const colSub = 460;

  doc.setFont(undefined, 'bold');
  doc.setFontSize(9);
  doc.text('Código', colCode, y);
  doc.text('Producto', colName, y);
  doc.text('Cajas', colQty, y);
  doc.text('S/', colSub, y);
  y += 8;
  doc.setDrawColor(200, 200, 200);
  doc.line(marginX, y, 555, y);
  y += 14;

  doc.setFont(undefined, 'normal');

  rows.forEach(r => {
    if (y > 780) {
      doc.addPage();
      y = 50;
    }
    doc.setFontSize(8.5);
    doc.text(r.code, colCode, y);
    const nameLines = doc.splitTextToSize(r.name, 320);
    doc.text(nameLines, colName, y);
    doc.text(String(r.qty), colQty, y);
    doc.text(fmt(r.subtotal), colSub, y);
    y += Math.max(14, nameLines.length * 11);
  });

  y += 6;
  doc.setDrawColor(0, 61, 165);
  doc.setLineWidth(1);
  doc.line(marginX, y, 555, y);
  y += 18;

  doc.setFont(undefined, 'bold');
  doc.setFontSize(11);
  doc.text('TOTAL CAJAS: ' + totalCajas, colCode, y);
  doc.text('TOTAL S/: ' + fmt(totalMonto), colQty, y);

  const fileName = 'pedido_' + (cliente ? cliente.replace(/\s+/g, '_') : 'sin_nombre') + '.pdf';
  const pdfBlob = doc.output('blob');
  lastFile = new File([pdfBlob], fileName, { type: 'application/pdf' });
  statusEl.textContent = 'PDF generado. Puedes verlo abajo antes de compartir.';
  showPreview(lastFile, 'pdf');
}

async function emitirImagen() {
  const statusEl = document.getElementById('pdfStatus');
  const { entries, cliente, rows, totalCajas, totalMonto } = buildOrderData();
  if (entries.length === 0) {
    statusEl.textContent = 'Agrega cantidades antes de emitir la imagen.';
    return;
  }
  statusEl.textContent = 'Generando imagen...';

  const width = 800;
  const rowHeight = 26;
  const headerHeight = 130;
  const footerHeight = 50;
  const height = headerHeight + rows.length * rowHeight + footerHeight + 30;

  const canvas = document.createElement('canvas');
  const scale = 2;
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);

  const fechaStr = new Date().toLocaleString('es-PE', { dateStyle: 'full', timeStyle: 'short' });
  let y = 40;

  ctx.fillStyle = '#003DA5';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('Resumen de Pedido', 30, y);
  y += 26;

  ctx.fillStyle = '#333333';
  ctx.font = '13px Arial';
  ctx.fillText('Fecha: ' + fechaStr, 30, y);
  y += 18;
  if (cliente) {
    ctx.fillText('Cliente: ' + cliente, 30, y);
    y += 18;
  }
  y += 8;

  ctx.strokeStyle = '#003DA5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(30, y);
  ctx.lineTo(width - 30, y);
  ctx.stroke();
  y += 22;

  const colCode = 30;
  const colName = 110;
  const colQty = 560;
  const colSub = 650;

  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = '#003DA5';
  ctx.fillText('Código', colCode, y);
  ctx.fillText('Producto', colName, y);
  ctx.fillText('Cajas', colQty, y);
  ctx.fillText('S/', colSub, y);
  y += 8;

  ctx.strokeStyle = '#dddddd';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(30, y);
  ctx.lineTo(width - 30, y);
  ctx.stroke();
  y += 20;

  ctx.font = '12px Arial';
  ctx.fillStyle = '#1a1a2e';
  rows.forEach(r => {
    ctx.fillText(r.code, colCode, y);
    let name = r.name;
    if (name.length > 62) name = name.slice(0, 60) + '...';
    ctx.fillText(name, colName, y);
    ctx.fillText(String(r.qty), colQty, y);
    ctx.fillText(fmt(r.subtotal), colSub, y);
    y += rowHeight;
  });

  y += 4;
  ctx.strokeStyle = '#003DA5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(30, y);
  ctx.lineTo(width - 30, y);
  ctx.stroke();
  y += 26;

  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#003DA5';
  ctx.fillText('TOTAL CAJAS: ' + totalCajas, colCode, y);
  ctx.fillText('TOTAL S/: ' + fmt(totalMonto), colQty, y);

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  const fileName = 'pedido_' + (cliente ? cliente.replace(/\s+/g, '_') : 'sin_nombre') + '.png';
  lastFile = new File([blob], fileName, { type: 'image/png' });
  statusEl.textContent = 'Imagen generada. Puedes verla abajo antes de compartir.';
  showPreview(lastFile, 'image');
}

async function compartir() {
  const statusEl = document.getElementById('pdfStatus');
  if (!lastFile) {
    statusEl.textContent = 'Primero emite un PDF o una imagen.';
    return;
  }
  const cliente = document.getElementById('clienteInput').value.trim();

  if (navigator.canShare && navigator.canShare({ files: [lastFile] })) {
    try {
      await navigator.share({
        files: [lastFile],
        title: 'Pedido',
        text: 'Resumen de pedido' + (cliente ? ' - ' + cliente : '')
      });
      statusEl.textContent = 'Compartido correctamente.';
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') {
        statusEl.textContent = '';
        return;
      }
    }
  }

  // Fallback: download the file directly
  const url = URL.createObjectURL(lastFile);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastFile.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  statusEl.textContent = 'Archivo descargado (tu navegador no permite compartir directamente).';
}

render();
